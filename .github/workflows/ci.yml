# Verificação automática: roda a cada push e pull request.
# Não usa os dados reais da ANP (os testes criam CSVs pequenos de exemplo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependências
        run: pip install -r requirements/requirements-dev.txt

      - name: Verificar estilo (ruff)
        run: ruff check .

      - name: Rodar testes (pytest)
        run: pytest

  banco:
    # Testa os scripts da pasta sql/ e a carga (src/carregar_banco.py) em um
    # PostgreSQL temporário, criado só para esta verificação e apagado no final.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anp_teste
          # senha de um banco descartável de teste, não é um segredo
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANP_TESTE_BANCO: "1"
      DB_NAME: anp_teste
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependências
        run: pip install -r requirements/requirements-dev.txt

      - name: Rodar testes do banco (pytest)
        run: pytest tests/test_banco.py -v
