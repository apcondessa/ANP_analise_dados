# Verificação automática: roda a cada push e pull request.
# Não usa os dados reais da ANP (os testes criam CSVs pequenos de exemplo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependências
        run: pip install -r requirements/requirements-dev.txt

      - name: Verificar estilo (ruff)
        run: ruff check .

      - name: Rodar testes (pytest)
        run: pytest
